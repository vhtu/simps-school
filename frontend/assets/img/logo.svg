<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Hình tròn nền -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)" />
  <!-- Biểu tượng trường học - mái nhà -->
  <polygon points="100,35 45,75 155,75" fill="white" />
  <!-- Thân tòa nhà -->
  <rect x="55" y="75" width="90" height="60" fill="white" rx="2" />
  <!-- Cửa chính -->
  <rect x="85" y="95" width="30" height="40" fill="#2563eb" rx="2" />
  <!-- Cửa sổ trái -->
  <rect x="62" y="85" width="16" height="16" fill="#2563eb" rx="2" />
  <!-- Cửa sổ phải -->
  <rect x="122" y="85" width="16" height="16" fill="#2563eb" rx="2" />
  <!-- Chữ SIMPS -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">SIMPS</text>
</svg>
